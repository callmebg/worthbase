name: CI

# 改动理由（2026-10-04）：
#   原来只有 workflow_dispatch —— push 和 PR 根本不触发，而 CONTRIBUTING.md 却写着
#   「所有 CI 检查通过」，等于门禁形同虚设。
#   另外原来 `./gradlew assembleRelease || (echo "..."; exit 0)` 会把构建失败吞成成功，
#   CI 永远是绿的。现在两者都修掉。
on:
  push:
    branches: ['**']
    # 推版本号 tag 就自动发 GitHub Release（带 APK）。
    # 仓库历史的 tag 没有 v 前缀（1.7.2 / 1.8.0），所以匹配 *.*.*
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

permissions: read-all

# 同一分支的新推送取消仍在跑的旧任务，省 CI 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  # ─── 快速门禁：不需要 Android SDK，1~2 分钟内给出结论 ───
  gates:
    name: Gates (version / typecheck / lint / test)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 让 check-version 能看到 tag

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # 三处版本号必须一致（package.json / app.json / build.gradle）
      - name: Check version consistency
        run: npm run check:version

      # tsc 必须零错误。项目已不存在「可忽略的历史 TS 错误」，
      # 不要用 @ts-ignore 或重新引入豁免清单来让它变绿。
      - name: Type check
        run: npm run typecheck

      # error 直接失败；warning 有棘轮上限（见 package.json 的 lint:ci），只许减不许增
      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm test

  # ─── Android 构建：用 runner 镜像自带的 Android SDK（不再自装），所以放在门禁之后，且 PR 上不跑 ───
  android-build:
    name: Android release build
    runs-on: ubuntu-24.04
    needs: gates
    if: github.event_name != 'pull_request'
    # 覆盖 workflow 级的 read-all：tag 推送时最后一步要用 gh 发 Release。
    # GitHub 不支持 step 级权限，所以只能挂在整个 job 上——代价是普通分支推送
    # 也带着 contents: write。token 只对本仓库有效，且本 job 本来就在跑
    # npm ci / gradle 这类任意代码，边际风险很小。
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # runner 镜像已预装 Android SDK 并接受好许可证（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 缺的 platform / build-tools / ndk 由 AGP 在构建时按需自动下载。
      # 不要再另装一份 SDK 并导出 ANDROID_SDK_ROOT —— 那会和 ANDROID_HOME 指向不同路径，
      # 触发 AGP 的 “Several environment variables ... contain different paths to the SDK” 报错。

      - name: Prebuild Android (generate native project)
        run: npx expo prebuild --platform android --non-interactive

      # /android 被 gitignore，只有 prebuild 之后才存在 build.gradle。
      # gates job 里的那次校验只比对了 package.json 与 app.json（两处），
      # 这里加 --strict 做真正的三处一致性校验。
      - name: Check version consistency (incl. generated build.gradle)
        run: npm run check:version -- --strict

      - name: Restore Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      # 关键修正：不再 `|| exit 0` 吞掉失败。构建坏了这里就必须红。
      # gradlew 缺失同样视为失败（prebuild 本该生成它），不再静默跳过。
      # GRADLE_USER_HOME 刻意**不设**，让 Gradle 走默认的 ~/.gradle ——
      # 上面 Restore Gradle cache 存取的正是这个目录。
      # 之前这里设成 ${{ runner.temp }}/.gradle，和缓存路径完全错开，导致缓存
      # 从来没命中过：每次构建都从零下载全部依赖，Maven 中央仓抖一下就整条红。
      # （2026-11-08 run #11：SocketTimeoutException: Read timed out @ downloadByCoords）
      #
      # 顺带去掉原来那个 "Save Gradle cache" 步骤：actions/cache（非 restore 版）
      # 在 key 未命中时本来就会在 job 结束自动保存，再用同一个 key 存一次只会
      # 得到 "Cache already exists" 的警告。
      #
      # 重试 3 次：Gradle 拉依赖的超时/重试参数已由 with-android-optimize.js 注入
      # gradle.properties，这里再兜一层，防的是 wrapper 自身或整段网络抽风。
      - name: Build Android release APK (local)
        working-directory: android
        run: |
          set -e
          if [ ! -f gradlew ]; then
            echo "::error::android/gradlew 不存在 —— expo prebuild 未生成原生工程"
            exit 1
          fi
          echo "Starting local Gradle build..."
          attempt=1
          until ./gradlew assembleRelease --stacktrace; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Gradle 构建连续 3 次失败"
              exit 1
            fi
            echo "::warning::Gradle 第 $attempt 次构建失败（大概率是依赖下载超时），20s 后重试"
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Verify APK was produced
        run: |
          set -e
          if ! ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "::error::Gradle 报告成功但没有产出 APK"
            exit 1
          fi
          ls -la android/app/build/outputs/apk/release/

      # 把 Gradle 产出的 app-release.apk 重命名为 WorthBase-<短commit>-<北京时间>.apk，
      # artifact 名与文件名保持一致，便于区分不同构建。
      - name: Rename APK (WorthBase-commit-time)
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          TS=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M%S)
          BASE="WorthBase-${SHORT_SHA}-${TS}"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mv "$SRC" "android/app/build/outputs/apk/release/${BASE}.apk"
          echo "APK_BASENAME=${BASE}" >> "$GITHUB_ENV"
          echo "Renamed APK -> ${BASE}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME }}
          path: android/app/build/outputs/apk/release/${{ env.APK_BASENAME }}.apk
          if-no-files-found: error

      # ─── 自动发 GitHub Release（仅 tag 推送）───
      # 用 runner 预装的 gh CLI，不引入新的 action 依赖（也不用猜
      # download-artifact 的版本能否配 upload-artifact@v6）。APK 就在本 job 的
      # 磁盘上，所以**发布出去的包和 CI 刚刚验证过的包是同一个文件**——
      # 不存在「另起一个 workflow 重新构建，结果发出一个没验证过的包」的风险。
      #
      # 发布说明取 docs/release-notes/<版本号>.md；没有就退回自动生成变更列表。
      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          APK="android/app/build/outputs/apk/release/${APK_BASENAME}.apk"
          NOTES="docs/release-notes/${VERSION}.md"

          if [ ! -f "$APK" ]; then
            echo "::error::找不到待发布的 APK: $APK"
            exit 1
          fi

          # Release 可能已经手动建过了——本项目就有先例：1.8.0 是先手动发布、后补 tag。
          # 这种情况不该红，改成只把 APK 附件传上去，标题和正文一个字都不动。
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} 已存在 —— 只上传 APK 附件，不改标题与正文"
            gh release upload "$VERSION" "$APK" --clobber
          elif [ -f "$NOTES" ]; then
            echo "使用手写发布说明: $NOTES"
            gh release create "$VERSION" "$APK" \
              --title "家底 ${VERSION}" \
              --notes-file "$NOTES" \
              --verify-tag
          else
            echo "::warning::未找到 $NOTES，改用自动生成的变更列表。想要手写说明，在 docs/release-notes/ 下放一个 <版本号>.md 即可"
            gh release create "$VERSION" "$APK" \
              --title "家底 ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi

      # 仅在失败时上传原生工程，便于排查（原来是无条件上传，噪音大）
      - name: Upload generated android project (debug only)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-project
          path: android
          if-no-files-found: warn
