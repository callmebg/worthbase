name: CI

# 改动理由（2026-10-04）：
#   原来只有 workflow_dispatch —— push 和 PR 根本不触发，而 CONTRIBUTING.md 却写着
#   「所有 CI 检查通过」，等于门禁形同虚设。
#   另外原来 `./gradlew assembleRelease || (echo "..."; exit 0)` 会把构建失败吞成成功，
#   CI 永远是绿的。现在两者都修掉。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions: read-all

# 同一分支的新推送取消仍在跑的旧任务，省 CI 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  # ─── 快速门禁：不需要 Android SDK，1~2 分钟内给出结论 ───
  gates:
    name: Gates (version / typecheck / lint / test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 让 check-version 能看到 tag

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # 三处版本号必须一致（package.json / app.json / build.gradle）
      - name: Check version consistency
        run: npm run check:version

      # tsc 必须零错误。项目已不存在「可忽略的历史 TS 错误」，
      # 不要用 @ts-ignore 或重新引入豁免清单来让它变绿。
      - name: Type check
        run: npm run typecheck

      # error 直接失败；warning 有棘轮上限（见 package.json 的 lint:ci），只许减不许增
      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm test

  # ─── Android 构建：慢（要装 SDK），所以放在门禁之后，且 PR 上不跑 ───
  android-build:
    name: Android release build
    runs-on: ubuntu-latest
    needs: gates
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Restore Android SDK subdirs cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk/cmdline-tools
            ${{ runner.temp }}/android-sdk/platforms
            ${{ runner.temp }}/android-sdk/build-tools
            ${{ runner.temp }}/android-sdk/platform-tools
          key: android-sdk-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install Android SDK command-line tools (if needed)
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget lib32stdc++6 lib32z1
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/platform-tools" ] && [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] && [ -d "$ANDROID_SDK_ROOT/platforms/android-33" ] && [ -d "$ANDROID_SDK_ROOT/build-tools/33.0.2" ]; then
            echo "Android SDK components already present in cache, skipping download.";
          else
            cd "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            if [ -d cmdline-tools ]; then
              mv cmdline-tools latest || true
            else
              mkdir -p latest
              mv * latest 2>/dev/null || true
            fi
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
            yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
            sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          fi

      - name: Save Android SDK subdirs to cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk/cmdline-tools
            ${{ runner.temp }}/android-sdk/platforms
            ${{ runner.temp }}/android-sdk/build-tools
            ${{ runner.temp }}/android-sdk/platform-tools
          key: android-sdk-${{ runner.os }}-v1

      - name: Prebuild Android (generate native project)
        run: npx expo prebuild --platform android --non-interactive

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      # 关键修正：不再 `|| exit 0` 吞掉失败。构建坏了这里就必须红。
      # gradlew 缺失同样视为失败（prebuild 本该生成它），不再静默跳过。
      - name: Build Android release APK (local)
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
        working-directory: android
        run: |
          set -e
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          if [ ! -f gradlew ]; then
            echo "::error::android/gradlew 不存在 —— expo prebuild 未生成原生工程"
            exit 1
          fi
          echo "Starting local Gradle build..."
          ./gradlew assembleRelease --stacktrace

      - name: Save Gradle cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Verify APK was produced
        run: |
          set -e
          if ! ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "::error::Gradle 报告成功但没有产出 APK"
            exit 1
          fi
          ls -la android/app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 仅在失败时上传原生工程，便于排查（原来是无条件上传，噪音大）
      - name: Upload generated android project (debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android
          if-no-files-found: warn
